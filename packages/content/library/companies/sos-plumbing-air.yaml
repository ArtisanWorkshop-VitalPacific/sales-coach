differentiators:
  - Water heater specialists for gas, electric, tankless, and heat pump units
  - Same-day service from fully stocked vans, ready to finish the job on the first visit
  - A labor warranty that is, on average, about twice as long as most competitors'
  - Required code upgrades and permit fees included in the written estimate
  - Free online quotes
  - Preferred pricing and priority scheduling for property managers, real estate agents, home warranty providers, and HOAs
scripts:
  preferred:
    - moment: Introduce yourself at the door
      line: >-
        Hi, I'm [your name] with SOS Plumbing and Air. You must be [customer name]. I
        hear the water heater's giving you trouble.
    - moment: Set the frame
      line: >-
        Here's how this works. I'll take a look, show you what I find, and give you a
        price in writing before I touch anything. And if a repair makes more sense
        than a new one, I'll tell you.
    - moment: Disclose a service call fee, when one applies
      line: >-
        Just so you know up front, there's a service call fee for today's visit. If
        you go ahead with the work today, it goes toward the repair.
    - moment: Repair is the better value
      line: >-
        Honestly, a repair makes more sense here than a new heater. Let me show you
        why.
    - moment: Present the written price on a water heater replacement
      line: >-
        Here's your price in writing. It covers the new heater, the expansion tank,
        the seismic straps, and the permit. That written number is the number you
        pay.
    - moment: Same-day install
      line: >-
        I've got what I need on the van, so if you want to go ahead, I can get it done
        today.
    - moment: Explain the labor warranty
      line: >-
        Our labor warranty runs about twice as long as what most companies offer. I'll
        show you the exact terms in writing.
    - moment: Mention financing
      line: >-
        If it's easier to spread this out, we do have financing on bigger jobs like
        this. Want me to find out what that would look like for you?
    - moment: Recommend maintenance
      line: >-
        One thing that'll help this heater last is a flush once a year. I'd put that
        on your calendar.
    - moment: Leave well
      line: >-
        No problem at all. Here's the price in writing, it's yours to keep. If
        anything changes, call us. We're here 24/7.
  banned:
    - "This price is only good today."
    - "That tank could go any minute."
    - "Trust me."
    - "Those other companies don't know what they're doing."
    - "While I'm here, I might as well replace this too."
    - "Repairs are a waste of money. You need a new one."
    - "We'll figure out the final price when I'm done."
    - "I need an answer before I leave."
    - "Our warranty covers anything that goes wrong."
    - "Everybody's going tankless. You'd be crazy not to."
objectionAnswers:
  - moveId: too-expensive
    answer: >-
      I get it, that's real money. Here's what's in it: the heater, the labor, the
      expansion tank and seismic straps code requires, and the permit, so nothing
      gets added later. Our labor warranty runs about twice as long as most
      companies', and the van's stocked, so it's done in one visit. If you'd rather
      look at a smaller option, I'll walk you through it, and we have financing on
      bigger jobs.
  - moveId: what-am-i-paying-for
    answer: >-
      Fair question. Here's the breakdown: the new heater, the labor, the expansion
      tank and seismic straps California code requires, and the permit. It's a flat
      price, so it doesn't change if the job takes longer. You're also getting a labor
      warranty that runs about twice as long as most companies', and a van that's
      stocked to finish the job today.
  - moveId: can-it-wait
    answer: >-
      Sometimes it can, so here's my honest read on yours. If it's still working and
      not leaking, waiting is a real option, and I'll tell you what to watch for. If
      the tank itself is leaking, that won't get better, and I'd plan for it soon.
      Either way, the written price is yours to keep, and we're here 24/7 if it gets
      worse.
  - moveId: just-repair-it
    answer: >-
      If a repair makes sense, that's what I'll recommend. We'll always tell you when
      a repair is the better value. If the part that failed can be fixed and the tank
      is sound, the repair is the right call. If the tank itself is failing, a repair
      won't hold, and I'll show you why.
  - moveId: do-i-need-the-code-stuff
    answer: >-
      Yes, and here's why. California code requires seismic straps and a thermal
      expansion tank when a water heater goes in, and the permit is part of doing it
      to code. That's why they're already in your written price instead of added on
      later.
  - moveId: show-me-in-writing
    answer: >-
      Absolutely. You'll get the price in writing before any work starts, and that
      written number is the number you pay. If anything changes once I'm in there, I
      stop and re-quote before I go any further.
  - moveId: need-three-bids
    answer: >-
      That's smart. Can I ask what you'll be comparing? Here's our price in writing,
      with the heater, the code upgrades, and the permit all included, so you can line
      it up against the others. It's worth asking each one whether theirs includes the
      expansion tank, the straps, and the permit, and how long their labor warranty
      runs.
  - moveId: you-always-upsell
    answer: >-
      Fair. We don't do the "while I'm here" add-ons. I'll show you what I found,
      tell you honestly if a repair makes more sense than replacing, and you choose.
      You can walk away anytime.
  - moveId: last-company-ripped-me-off
    answer: >-
      I'm sorry that happened. Here's how we work. You get the price in writing before
      any work, and that's the number you pay. If anything changes, I stop and
      re-quote first. No pressure, and no is a fine answer.
facts:
  - Founded in 2019 by owner Anna M. Family-owned and locally operated, based in Lake Elsinore.
  - California contractor license number 1140776. Licensed, bonded, and insured.
  - >-
    Water heater specialists. Gas, electric, tankless, and heat pump water heaters,
    repaired or replaced across the Inland Empire. Also plumbing and HVAC.
  - Same-day service. Fully stocked vans are ready to finish the job on the first visit.
  - 24/7 emergency service.
  - SOS says its labor warranty is, on average, about twice as long as most competitors'.
  - >-
    Upfront, written, flat-rate pricing. The written number is the number the
    customer pays, and a scope change means the tech stops and re-quotes first.
  - >-
    Water heater estimates include the code upgrades California requires (seismic
    strapping, a thermal expansion tank, and T&P valve discharge routing) and the
    permit fee.
  - "Water heater brands shown on the site: Rheem, Rinnai, Bradford White, and Navien."
  - Financing is available for larger repairs and replacements.
