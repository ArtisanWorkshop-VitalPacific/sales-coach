about: >-
  SOS Plumbing and Air, also known as Water Heater SOS, is a family-owned and locally
  operated company founded in 2019 by owner Anna M. It is based in Lake Elsinore and
  serves the Inland Empire. It specializes in water heaters (gas, electric, tankless,
  and heat pump) and also does plumbing and HVAC. The company promises same-day
  service from fully stocked vans, upfront written pricing, and 24/7 emergency
  service.
brandVoice:
  - >-
    Personal and caring. The owner's line is "We treat every home like it's our own."
    Treat the customer like family and their home like your own.
  - >-
    Ready to fix it today. Same-day service and a stocked van are the point. Say what
    can be done today, and never use speed to pressure a decision.
  - >-
    Straight about money. Give the written price before any work starts, and say any
    fee before it applies.
  - >-
    Honest about repair or replace. If a repair is the better value, say so, even
    when a new water heater would be a bigger ticket.
  - >-
    No pressure. Never rush a decision or push work the customer does not need. The
    customer can walk away anytime.
promises:
  - id: upfront-written-pricing
    label: Upfront, written pricing
    detail: >-
      Every job gets an upfront, written, flat-rate price before work starts. That
      written number is the number the customer pays. If the scope changes mid-job,
      the tech stops and re-quotes before continuing, and the price changes only with
      the customer's approval.
  - id: honest-recommendations
    label: Honest recommendations
    detail: >-
      The company says it will always tell the customer if a repair is more
      cost-effective than a replacement.
  - id: no-pressure
    label: No pressure sales
    detail: >-
      No high-pressure sales tactics, no rushing the customer into a decision, and no
      pushing services they do not need. The customer can walk away anytime.
  - id: same-day-stocked-vans
    label: Same-day service, fully stocked vans
    detail: >-
      Same-day water heater installation and repair. The vans are fully stocked so
      the tech can finish the job on the first visit.
  - id: labor-warranty
    label: Labor warranty about twice as long
    detail: >-
      SOS says its labor warranty is, on average, about twice as long as most of its
      competitors'. The site also says "We stand behind our labor and materials. If
      something isn't right, we make it right." The length in years is not stated on
      the site.
  - id: code-upgrades-included
    label: Code upgrades and permit in the estimate
    detail: >-
      Water heater estimates include the upgrades California code requires, such as
      seismic strapping, a thermal expansion tank, and T&P valve discharge routing.
      Permit fees are included in written estimates.
  - id: free-quotes
    label: Free quotes, no obligation
    detail: >-
      Quotes are free with no obligation, and a customer who does not move forward
      owes nothing. The pricing page also lists a service call or dispatch fee that is
      applied toward the repair when the customer approves the work on the same visit.
      Any fee is disclosed up front.
  - id: emergency-24-7
    label: 24/7 emergency service
    detail: Emergency service is available 24 hours a day, 7 days a week.
process:
  - id: arrive-and-set-frame
    name: Arrive and set the frame
    description: >-
      Introduce yourself and SOS Plumbing and Air, and confirm the customer's name and
      why they called. Explain the visit: you will look, show them what you find, and
      give them a written price before any work starts. Tell them that if a repair
      makes more sense than a replacement, you will say so. If a service call or
      diagnostic fee applies to this visit, say so now, and explain that it goes
      toward the repair if they approve the work on this visit.
    required: true
  - id: discovery
    name: Ask before you diagnose
    description: >-
      Ask what they have noticed and when it started, how old the water heater is, how
      many people live in the home, whether they run out of hot water, what has been
      done before, how long they plan to stay, and what matters most to them: cost,
      speed, or doing it once.
    required: true
  - id: inspect
    name: Inspect the water heater and the code items
    description: >-
      Read the label for the brand, size, and age. Diagnose the problem they called
      about. Check the items California code requires on a water heater: seismic
      strapping, a thermal expansion tank, and T&P valve discharge routing, plus the
      venting and gas or electrical connection. Take photos of what you find.
    required: true
  - id: show-findings
    name: Show and explain what you found
    description: >-
      Show the photos or the part. Explain each finding in plain words: what it is,
      why it matters, and how urgent it is. Tell them honestly whether a repair is
      more cost-effective than a replacement on their unit. Do not call anything
      urgent that is not.
    required: true
  - id: present-options
    name: Present options
    description: >-
      Give two or three options tied to what they told you. Include the repair when a
      repair will hold. For replacements, cover the size and type that fit the
      household. Say which option you recommend and why, in one or two sentences.
    required: true
  - id: written-price
    name: Give the upfront written price
    description: >-
      Write the price before any work starts, with the required code upgrades and the
      permit fee included. Pricing is flat rate. Say the price clearly, once, then
      stop talking and let the customer think. That written number is the number they
      pay.
    required: true
  - id: answer-questions
    name: Answer questions honestly
    description: >-
      Ask what questions they have and answer each concern directly. Explain what is
      in the price, the labor warranty, and that the van is stocked to finish today.
      If cost is the concern, offer the other options, and mention that financing is
      available for larger repairs and replacements. Do not quote financing terms the
      office has not confirmed. No pressure, and the customer can walk away anytime.
    required: true
  - id: ask-for-decision
    name: Ask for the decision
    description: >-
      Ask plainly which option they want. On a yes, do the work the same day from the
      stocked van when you can. If the scope changes mid-job, stop and re-quote before
      continuing, and go ahead only with their approval.
    required: true
  - id: recommend-maintenance
    name: Recommend maintenance
    description: >-
      Recommend a yearly water heater flush when it fits what you found, since the
      company says a yearly flush helps a water heater last longer. SOS does not list
      a membership on its website, so do not offer one unless the office confirms it.
    required: false
  - id: clean-up-and-wrap
    name: Clean up, explain the warranty, and leave well
    description: >-
      Clean the work area. Test the work with the customer and show them what you
      did. Explain the labor warranty and how to reach SOS, including 24/7 emergency
      service. Thank them. On a no, leave the written price with them and thank them
      just the same.
    required: true
financing:
  available: true
  summary: >-
    The site says financing is available, with flexible payment options for larger
    repairs and replacements, and tells customers to ask their technician. It does
    not name a lender or list rates, terms, minimums, or credit requirements. Techs
    should not quote terms until the owner confirms them.
  verified: false
