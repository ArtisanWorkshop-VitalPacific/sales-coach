review:
  status: draft
  author: Claude
  notes:
    - >-
      Written from waterheatersos.com pages retrieved 2026-10-22. All listed pages
      loaded. FAQ answers on the site are collapsed and did not appear in the page
      text, so nothing from them is used.
    - >-
      Verify with the owner. Labor warranty length. The home page says "Our labor
      warranty, on average, is twice as long than most of our competitors," but no
      page states the length in years. Scripts say "about twice as long" and promise
      the exact terms in writing. Add the real length once confirmed.
    - >-
      Verify with the owner. Fees. The site says quotes are free with no obligation,
      but /transparent-pricing lists a $49 to $89 service call or dispatch fee
      (applied toward the repair when the work is approved on the same visit) and an
      $89 to $149 diagnostic fee ("waived or applied"). Confirm when each fee applies,
      whether either applies to a free replacement estimate, and what a customer owes
      if they decline. The spec tells techs to disclose any fee before it applies.
    - >-
      Verify with the owner. The site shows a "No OT Fees" badge and also lists a $149
      to $249 after-hours or emergency fee. Confirm what "No OT Fees" means. The spec
      does not use it in scripts or facts.
    - >-
      Verify with the owner. Financing. The site says only "Flexible payment options
      for larger repairs and replacements, ask your technician." Lender, rates, terms,
      minimums, and credit requirements are not stated, so financing is verified:
      false and no terms appear in scripts.
    - >-
      Verify with the owner. Membership. No membership or maintenance plan appears on
      the site, so there is no membership block. The process step recommends the
      yearly flush the site describes and is marked required: false. If SOS has a
      membership, add it here.
    - >-
      Verify with the owner. Brands. The site shows Rheem, Rinnai, Bradford White, and
      Navien logos as trusted water heater brands, along with Hajoca, which is a
      supply house. Confirm which brands SOS installs and stocks on the vans.
    - >-
      Verify with the owner. Haul-away of the old water heater is not mentioned on the
      site, so the spec does not promise it.
    - >-
      Verify with the owner. Base location. The About page says "a family-owned
      business based in Redlands, California," but every page lists 571 Crane St,
      Unit H, Lake Elsinore. The spec uses Lake Elsinore.
    - >-
      Verify with the owner. Ratings. The home page shows 4.9 from 542 Google reviews,
      other pages show 5.0 with no source, and one counter reads "0+ Reviews." Ratings
      are left out of facts.
    - >-
      Verify with the owner. A "Satisfaction Guarantee" badge appears with no terms,
      so it is not used as a promise.
    - >-
      Verify with the owner. The home page mentions heat pump water heater rebates
      under California and IRA programs. Federal incentive rules have changed since
      the IRA passed, so confirm which programs are current before techs cite any
      rebate.
    - >-
      Verify with the owner. /discount-water-heaters lists booking offers ($100 off a
      water heater replacement, $250 off a tankless installation, $25 off a flush, and
      $300 off whole-house water filtration) with "mention code at time of booking."
      No code, expiration, or stacking rules are shown. Not used in scripts. Confirm
      whether techs can honor them in the home.
    - >-
      Verify with the owner. The site shows "CA LIC# 1140776" without naming the
      license classifications. Confirm the classifications for plumbing and HVAC work,
      and how techs should refer to the owner (the About page lists "Anna M.").
    - >-
      The process steps, brand voice, scripts, and objection answers were written by
      Claude from the site's promises. The owner should confirm they match how SOS
      trains its techs.
