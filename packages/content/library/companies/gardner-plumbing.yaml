review:
  status: draft
  author: Claude
  notes:
    - >-
      Written from gardnerplumbingco.com pages retrieved 2026-10-22. All listed pages
      loaded. FAQ answers on /guarantee, /gardner-shield, /financing, and
      /frequently-asked-questions did not appear in the page text, so nothing from
      those FAQs is used.
    - >-
      Verify with the owner. The business was founded in 1995 as Nootbar Plumbing, and
      Gardner family ownership began in September 2020. Techs should say "serving
      Riverside County since 1995", not "family-owned since 1995". Confirm the wording
      the owner wants.
    - >-
      Verify with the owner. Google review counts differ across pages (1,316, 1,315+,
      1,157+, 900+, and 600+), and the rating shows as both 4.9 and 5.0. Counts are
      left out of facts. Confirm the rating and count techs should cite.
    - >-
      Verify with the owner. PACE was added on request on October 23, 2026: $29.99 a
      month for plumbing, air conditioning, and electrical. Confirm what it includes
      in each trade (maintenance visits, discounts, priority, overtime), the contract
      and cancellation terms, and whether it replaces The Gardner Shield. Until then,
      techs name only the price and the three trades, and the Shield stays as the
      yearly option.
    - >-
      Verify with the owner. The Gardner Shield shows only annual prices, so
      annualPrice uses Bronze ($249). Confirm whether monthly billing exists, plus the
      cancellation terms and exclusions (FAQ answers did not load).
    - >-
      Verify with the owner. The Shield page says both "10% off every service" and 10
      percent off each tier's own trades. The spec uses the tier wording. Also confirm
      whether a customer who joins during the visit gets the member discount on that
      day's work. The spec does not claim it.
    - >-
      Verify with the owner. How techs should handle American Home Shield customers:
      whether Gardner takes only AHS-dispatched claims, and what a tech says when a
      customer who called Gardner directly has an AHS plan. Also confirm the official
