differentiators:
  - No trip fee and a free in-home estimate on every call
  - Written estimate before work begins, and the number you sign is the number you pay
  - 30-day callback guarantee that covers parts and labor
  - Six-step Clean Visit Promise on every call
  - Plumbing, air conditioning, and electrical from one company, with one subscription across all three, PACE, at $29.99 a month
  - Trusted American Home Shield contractor and Moen Certified installer
scripts:
  preferred:
    - moment: Introduce yourself at the door
      line: >-
        Hi, I'm [your name] with Gardner Plumbing. Give me one second to put my shoe
        covers on before I come in.
    - moment: Set the frame
      line: >-
        Here's how this works. I'll take a look, show you what I find, and write up
        your options before any work starts. There's no trip fee for today, and
        you're not obligated to go ahead.
    - moment: Discovery
      line: >-
        Before I start, walk me through what you've noticed and when it started. And
        how long are you planning to be in this house?
    - moment: Show the finding
      line: >-
        Come take a look with me. Here's what I found, here's why it matters, and
        here's what's in good shape.
    - moment: Present the written estimate
      line: >-
        Here's your written estimate. It lists the scope, the materials, and the
        labor. The number you sign is the number you pay.
    - moment: The scope changes mid-job
      line: >-
        I found something I didn't expect. I'm going to stop here and write up the
        change, and nothing goes further unless you sign off on it.
    - moment: Offer financing
      line: >-
        If it helps to spread this out, there's a twelve-month plan that's no interest
        if it's paid in full in those twelve months. I'll walk you through exactly how
        it works so there are no surprises.
    - moment: Offer PACE
      line: >-
        One more thing, and it's completely your call. We have a home service
        subscription called PACE. It's twenty-nine ninety-nine a month, and it covers
        your plumbing, your air conditioning, and your electrical with us. Want me to
        go over it?
    - moment: Offer The Gardner Shield instead
      line: >-
        If you'd rather pay once a year, The Gardner Shield is two forty-nine a year
        for plumbing. You get two maintenance visits, ten percent off plumbing work, a
        free drain cleaning each year when there's an accessible cleanout, and no
        overtime charges at night or on weekends.
    - moment: Explain the guarantee
      line: >-
        If this same problem comes back within thirty days, call us. We come back at
        no charge, parts and labor.
    - moment: Leave well
      line: >-
        I've cleaned up, and the old parts are going out on my truck. If I missed
        anything, call the office and they'll send someone back the same business day.
  banned:
    - "This price is only good today."
    - "I need an answer before I leave."
    - "Trust me."
    - "Let's get started and I'll write up the price after."
    - "There's a charge for coming out if you don't go ahead."
    - "Those other plumbers are crooks."
    - "It's zero interest, no catch."
    - "The Shield is basically a warranty. It covers everything."
    - "PACE covers everything."
    - "Home warranties never pay. Don't bother with them."
    - "Let me call my manager and see what special deal I can get you."
objectionAnswers:
  - moveId: show-me-in-writing
    answer: >-
      Absolutely, that's how we do every job. You'll get a written estimate before any
      work starts, with the scope, the materials, and the labor spelled out. The
      number you sign is the number you pay. If I find something else once I'm in
      there, I stop and write up the change, and nothing moves forward without your
      written okay.
  - moveId: need-three-bids
    answer: >-
      That makes sense, it's a real decision. Can I ask what you'll be comparing,
      mostly price or what's included? Your written estimate lists the scope, the
      materials, and the labor, so you can hold it up against the others line by
      line. There's no trip fee and no charge for today's estimate. If you have
      questions about the other quotes, call me.
  - moveId: home-warranty-covers-it
    answer: >-
      It might, and it's worth checking before you pay for anything. We're an
      American Home Shield contractor, so we work with these plans. The warranty
      company decides what's covered, not us. If part of the job isn't covered, I'll
      write that part up so you see the price before you decide. And the Gardner
      Shield isn't a warranty. It's two maintenance visits a year, priority service,
      and a member discount.
  - moveId: you-always-upsell
    answer: >-
      Fair question, and I'd rather show you than tell you. I'll walk you through what
      I found, what needs fixing, and what's fine as it is. You'll get your options in
      writing, including the simplest repair that'll actually hold, and you pick. And
      if the same problem comes back within thirty days, we come back at no charge,
      parts and labor.
  - moveId: how-do-i-know-its-broken
    answer: >-
      Good question. Come look with me, and I'll show you exactly what I'm seeing, the
      photos, the camera video, or the part itself. If you'd like a second opinion,
      that's completely fine. The estimate visit doesn't cost you anything, and we'll
      be here when you're ready.
  - moveId: last-company-ripped-me-off
    answer: >-
      I'm sorry, that shouldn't have happened. Here's how we work. You get a written
      estimate before any work starts, and the number you sign is the number you pay.
      If anything changes, I stop and get your written okay first. There's no trip
      fee, and you're under no obligation if you decide not to go ahead.
  - moveId: charge-me-hourly
    answer: >-
      Our pricing is flat rate. The price is set by the job, not the clock, so if it
      takes me longer than I expect, your price doesn't change. You'll see the full
      number in writing before I start, and that's the number you pay.
  - moveId: whats-the-catch
    answer: >-
      Fair to ask. The twelve-month plan through GreenSky is no interest if you pay it
      off in full within twelve months. Interest is billed during that time, and it's
      waived only if the full amount is paid by the end, so minimum payments alone
      won't get you there. There's also a fixed plan at eleven point nine nine percent
      APR over a hundred and eighty months. Both need credit approval, and an
      origination fee may apply.
  - moveId: what-do-i-actually-get
    answer: >-
      Here's exactly what you get. PACE is twenty-nine ninety-nine a month, and it
      covers your plumbing, air conditioning, and electrical with us in one plan. If
      you'd rather pay once a year for plumbing only, the Bronze Shield is two
      forty-nine a year: two plumbing maintenance visits, a yearly safety inspection
      with a written report, ten percent off plumbing work, one free drain cleaning a
      year if there's an accessible cleanout, priority dispatch, and no emergency
      overtime charges. If you wouldn't use it, I'll tell you it's not worth it.
  - moveId: too-expensive
    answer: >-
      I hear you. Let me show you what's in that number, line by line. If one of the
      other options fits better, we can go that way, and I'll write it up the same
      way. And if spreading it out would help, there's a twelve-month plan that's no
      interest if it's paid in full in those twelve months, with credit approval.
facts:
