about: >-
  Gardner Plumbing Co. is a family-owned company based in Murrieta that has served
  Riverside County since 1995. It works in homes, HOAs, restaurants, and small to
  mid-size commercial properties. The business started as Nootbar Plumbing. The
  Gardner family took ownership in 2020 and renamed it Gardner Plumbing Co. in 2024.
  It offers plumbing, HVAC, and electrical service. The company calls its promise on
  every call The Gardner Standard: written estimates, no trip fees, clean visits, and
  a 30-day guarantee.
brandVoice:
  - >-
    Warm and respectful. The company describes its approach as treating every
    customer like a valued neighbor. Use the customer's name and take care with their
    home and their time.
  - >-
    Plain and direct. Short sentences, plain words, and real numbers. Explain any
    trade term you use.
  - >-
    Confident without pushing. State the recommendation and the price once, clearly,
    then let the customer think.
  - >-
    Accountable. The company's own line is "We own it." Point to the written estimate
    and the 30-day guarantee instead of making verbal promises. If something goes
    wrong, say so and say what you will do about it.
  - >-
    No pressure. A no, a wait, or a second opinion is fine, and the customer should
    hear that from you.
promises:
  - id: callback-guarantee
    label: 30-Day Callback Guarantee
    detail: >-
      If the same issue comes back within 30 days of the visit, a technician returns
      at no charge. Parts from the original job are re-supplied at no cost, and
      callback labor is covered with no trip fee or hourly rate. It covers the same
      root cause, not a separate problem somewhere else.
  - id: written-estimate
    label: Written Estimate Before Work Begins
    detail: >-
      Every job starts with a written estimate listing scope, materials, and labor.
      The number you sign is the number you pay. If the scope changes mid-job, work
      stops and a revised estimate is presented, and nothing goes further without the
      customer's written sign-off.
  - id: no-trip-fees
    label: No Trip Fees, No Pressure
    detail: >-
      Free in-home estimate with zero obligation. No dispatch fee, service-call fee,
      or fuel surcharge. A customer who declines the estimate owes nothing. The
      company says it never uses pressure tactics or inflated book-rate pricing to
      create urgency.
  - id: clean-visit-promise
    label: Clean Visit Promise
    detail: >-
      Six steps on every call: shoe covers before stepping inside, drop cloths under
      every work area, path protection from the entry to the work area, towels around
      every fixture, full cleanup before the job is called done, and haul-away of all
      old parts and packaging. If a step is missed, a technician comes back the same
      business day at no charge.
  - id: workmanship-guarantee
    label: 1-Year Workmanship Guarantee
    detail: >-
      Installations and repairs carry a 1-year workmanship guarantee. Parts carry the
      manufacturer's warranty. Warranty details are written on the invoice.
  - id: licensed-bonded-insured
    label: Fully Licensed, Bonded and Insured
    detail: >-
      CSLB license number 1073177, which customers can look up at cslb.ca.gov. The
      company carries liability insurance and workers' compensation.
process:
  - id: arrive-and-set-frame
    name: Arrive, protect the home, and set the frame
    description: >-
      Put shoe covers on at the door, before stepping inside. This is the first step
      of the Clean Visit Promise. Introduce yourself and Gardner Plumbing, and confirm
      the customer's name and why they called. Explain the visit: you will look, show
      them what you find, and give them a written estimate before any work begins.
      Say there is no trip fee and no obligation to go ahead.
    required: true
  - id: discovery
    name: Ask before you diagnose
    description: >-
      Ask what they have noticed, when it started, what has been done before, how old
      the system is, how long they plan to stay in the home, and what matters most to
      them: cost, timing, or doing it once. Listen and write down what they say. Their
      answers shape the options.
    required: true
  - id: inspect
    name: Inspect and protect the work area
    description: >-
      Follow the Clean Visit Promise before any tool comes out: path protection from
      the entry to the work area, a drop cloth under the work area, and clean towels
      around every fixture. Diagnose the problem they called about, then check the
      related items a careful plumber would check. Take photos or camera video of what
      you find.
    required: true
  - id: show-findings
    name: Show and explain what you found
    description: >-
      Show the photos, the camera video, or the part itself. Explain each finding in
      plain words: what it is, why it matters, and how urgent it is. Say what is in
      good shape too. Do not recommend work the findings do not support.
    required: true
  - id: present-options
    name: Present options
    description: >-
      Give two or three options tied to what the customer told you, including the
      simplest repair that will hold when there is one. Say which option you
      recommend for their home and why, in one or two sentences.
    required: true
  - id: written-estimate
    name: Written estimate before work begins
    description: >-
      Write the estimate before any work begins: scope, materials, and labor, with
      permit fees on their own line. Pricing is flat rate, so the price does not
      change with the clock. Say the price clearly, once, then stop talking and let
      the customer think. The number they sign is the number they pay.
    required: true
  - id: answer-questions
    name: Answer questions honestly
    description: >-
      Ask what questions they have and answer each concern directly. When cost is the
      concern, show what is in the price, offer the other options, and explain
      financing as a monthly number with its real terms. A second opinion is fine,
      and the estimate visit costs them nothing. Never use pressure or urgency that is
      not real.
    required: true
  - id: ask-for-decision
    name: Ask for the decision
    description: >-
      Ask plainly which option they would like to go with. Get their written sign-off
      on the estimate before starting. If the scope changes mid-job, stop, write a
      revised estimate, and do not continue without their written sign-off.
    required: true
  - id: offer-membership
    name: Offer PACE or The Gardner Shield
    description: >-
      If they are not a member, offer a plan once and tie it to what you found. Lead
      with PACE, the home service subscription: $29.99 a month for plumbing, air
      conditioning, and electrical in one plan. Name only the price and the three
      trades until the owner confirms what else it includes. If they would rather pay
      once a year or want plumbing only, offer The Gardner Shield: Bronze (plumbing)
      is $249 a year, with two plumbing maintenance visits, 10 percent off plumbing
      services, one free drain cleaning a year with an accessible cleanout, priority
      dispatch, and no emergency overtime charges. Silver adds HVAC for $348 a year,
      and Gold adds HVAC and electrical for $397 a year. The Gardner Shield is not a
      warranty, so never call it one. Accept a no without a second push.
    required: true
  - id: clean-up-and-wrap
    name: Clean up, explain the guarantee, and leave well
    description: >-
      Finish the Clean Visit Promise: sweep or vacuum the work area, wipe down
      surfaces you touched, and remove all debris. Old parts and packaging leave on
      the Gardner truck unless the customer asks to keep them. Walk the customer
      through the work, explain
      the 30-day callback guarantee and the warranty terms on the invoice, and thank
      them. On a no, leave the written estimate and thank them just the same.
    required: true
memberships:
  - id: pace
    name: PACE
    summary: >-
      Home service subscription at $29.99 a month. One plan covers plumbing, air
      conditioning, and electrical.
    trades: [plumbing, hvac, electrical]
    benefits:
      - Covers plumbing
      - Covers air conditioning
      - Covers electrical
    monthlyPrice: 29.99
    lead: true
    verified: true
  - id: gardner-shield
    name: The Gardner Shield
    summary: >-
      Annual membership in three tiers. Bronze Shield (plumbing) is $249 a year,
      Silver Shield (plumbing and HVAC) is $348 a year, and Gold Shield (plumbing,
      HVAC, and electrical) is $397 a year. A plumbing and electrical combination is
      $298 a year. The company states it is not a warranty plan. It is a direct
      relationship with a licensed contractor: scheduled maintenance, priority
      service, no emergency overtime, and member discounts.
    trades: [plumbing, hvac, electrical]
    benefits:
      - Two plumbing maintenance visits a year
      - Annual plumbing safety inspection with a written inspection report
      - 10 percent off plumbing services
      - One free drain cleaning a year with an accessible cleanout
      - Priority service at the front of the dispatch queue, 24/7
      - No emergency overtime charges. Nights, weekends, and holidays are billed at standard rates.
      - >-
        Silver Shield adds two HVAC tune-ups a year (spring AC and fall heating), a
        refrigerant level check at every tune-up, 10 percent off HVAC services, and
        priority scheduling during summer AC failures.
      - >-
        Gold Shield adds an annual electrical safety inspection with a whole-home
        electrical safety report, 10 percent off electrical services, and priority
        response after storms and outages.
    annualPrice: 249
    verified: true
financing:
  available: true
  summary: >-
    Two lenders, both subject to credit approval: the GreenSky Program and Service
    Finance Company. GreenSky Plan 2613 is no interest if paid in full in 12 months.
    Interest is billed during the promo period and waived only if the amount financed
    is paid in full by the end, and minimum payments alone will not pay it off in
    time. GreenSky Plan 1519 is 11.99 percent APR fixed for 180 months, about $119.95
    a month for every $10,000 financed (the site calls this an estimate). An
    origination fee may apply, and GreenSky applicants must be homeowners. Service
    Finance terms are not listed on the site. The customer gets the written estimate
    first, then applies through a short digital application.
  verified: true
