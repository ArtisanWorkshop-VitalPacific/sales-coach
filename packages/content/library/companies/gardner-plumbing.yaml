    Serving Riverside County since 1995. The company started as Nootbar Plumbing, the
    Gardner family took ownership in September 2020, and it became Gardner Plumbing
    Co. in 2024.
  - Family-owned and based in Murrieta, at 30714 Wealth St.
  - >-
    CSLB license number 1073177, which customers can look up at cslb.ca.gov. Licensed,
    bonded, and insured, with liability insurance and workers' compensation.
  - >-
    No trip fee, no service-call fee, and no dispatch fee. The in-home estimate is
    free, with no obligation to go ahead.
  - >-
    Every job starts with a written estimate, and the number the customer signs is the
    number they pay.
  - >-
    If the same issue comes back within 30 days, a technician returns at no charge,
    with parts and labor covered.
  - Installations and repairs carry a 1-year workmanship guarantee, written on the invoice.
  - Trusted American Home Shield contractor and Moen Certified installer.
  - Financing through GreenSky and Service Finance Company, subject to credit approval.
  - >-
    PACE, the home service subscription, is $29.99 a month and covers plumbing, air
    conditioning, and electrical.
  - 24/7 emergency service, and a 4.9-star Google rating.
