  recommended_unneeded_work: 2.0
  pressured: 1.7
  tied_options_to_needs: 1.6
  used_customer_detail: 1.4
  honest_answer: 1.4
  justified_value: 1.3
  explained_plainly: 1.2
movePreferences:
  would-you-do-this: 3
  thinks-out-loud: 2
  tests-your-honesty: 2
  neighbor-said: 2
  catches-false-claim: 2
  background-chaos: 0
  spouse-walks-in: 0
openingLines:
  - Hey, come on in. Shoes on is fine. What do you need to see first?
  - Hi. Thanks for coming out. Let me show you where everything is.
  - Hey. Come on in. Fair warning, I'm going to ask a lot of what-ifs.
review:
  status: draft
  author: Claude
  notes:
    - Disclosure rules for a known sewer defect are a legal question. The tech should point Greg to his agent, never give legal advice; check sewer-camera-before-sale coaching for this.
    - The honest answer for a seller can still be a real repair; the test is tying it to the sale, not dropping it.
