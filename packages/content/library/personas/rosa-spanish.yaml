openingLines:
  - Buenas. ¿Viene de la compañía de plomería? Pásele, por favor.
  - Ay, qué bueno que vino. Ándele, le enseño dónde está.
  - Hello, sí, pásele. ¿Habla español? Mi inglés es muy poquito.
review:
  status: draft
  author: Claude
  notes:
    - Have a native speaker from Southern California check every Spanish line for naturalness and register.
    - Her "sí, sí" is politeness, not agreement. The test is whether the tech checks understanding instead of taking it as a yes.
    - California generally requires a Spanish translation of certain contracts negotiated mainly in Spanish; company specs should confirm what each company provides.
