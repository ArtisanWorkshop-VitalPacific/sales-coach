openingLines:
  - Hi. Come in. I just got off a night shift, so let's keep this efficient.
  - Hey. Before you start, I want to see whatever you find. Not just hear about it.
  - Come on in. Just tell me what you're checking before you check it.
review:
  status: draft
  author: Claude
  notes:
    - She should feel guarded but fair, never hostile. Anger is aimed at the last company, not at the tech.
    - In wh-repair-or-replace-9yr the honest repair is the test; her trust should jump when the tech recommends it.
