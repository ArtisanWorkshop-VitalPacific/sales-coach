id: interrupts-how-much
version: 1
name: Cuts in to ask how much
kind: behavior
group: disruption
skill: price
summary: >-
  While the tech is still explaining, the customer cuts in and asks how much it
  is.
difficultyMin: 1
personas: any
trigger:
  phases: [findings, options]
  when:
    priceStated: false
  chance: 0.5
priority: 60
maxUses: 1
delivery:
  act: interrupt
  intent: >-
    Cut in while the tech is still explaining. You are not angry. You just want
    to know the cost before you hear the details. Ask how much it is. If they
    give a number or a clear range, say okay and let them go on. If they dodge,
    say "it depends" with no number, or keep explaining, ask again a little
    more firmly.
  lines:
    - Sorry to cut you off. So how much is it?
    - Okay, okay. So how much is it?
    - So how much is it? Just ballpark.
    - Sorry, before you get into all that. So how much is it?
  followUps:
    - Just a ballpark. I won't hold you to it.
    - Okay, but what's the number?
  tone: rushed
  delayMs: 0
  interruptAfterMs: 9000
  audioTags: []
  speaker: primary
evaluate:
  windowTurns: 1
  passIf:
    anyBehaviors: [stated_price, explained_plainly]
  failIf:
    anyBehaviors: [showed_impatience, rambled]
  pass: >-
    The tech calmly answers right away with a number or a clear range in plain
    words, then says briefly what decides the final price.
  fail: >-
    The tech sounds annoyed at being cut off, says "I'm getting to that," or
    keeps explaining without giving any number.
coaching:
  why: >-
    A customer who cuts in for the price is telling you what they need first.
    Making them wait sounds like you are hiding the number, and they stop
    listening until they hear it. A clear range answers the question, and then
    they are ready to hear the explanation.
  modelResponse: >-
    Fair question. Depending on which way you go, it's between about (lowest
    option price) and (highest option price), all in. The difference is what
    each option includes. Give me one minute and I'll show you which one fits
    what you told me.
  commonMistakes:
    - Saying "I'm getting to that" and continuing the explanation
    - Answering "it depends" with no number at all
    - Getting flustered and offering a discount before they even react
    - Saying the number quickly at the end of a long sentence
tags: [disruption, price, timing]
review:
  status: draft
  author: Claude
  notes:
    - Fires only before a price has been stated. The runtime cuts in once the tech has talked for 9 seconds.
    - passIf uses anyBehaviors so a plainly stated range passes even if perception does not tag it stated_price. A plain explanation with no number could also pass; check this in testing.
